name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org

      - name: Run tests
        run: |
          pip install pytest
          pytest tests/ -v

      - name: Detect beta release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == *-* ]]; then
            echo "NPM_TAG=beta" >> "$GITHUB_ENV"
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "NPM_TAG=latest" >> "$GITHUB_ENV"
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Publish to npm
        run: npm publish --provenance --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ""

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          generate_release_notes: true

      - name: Trigger Homebrew tap update
        if: env.IS_PRERELEASE == 'false'
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.HOMEBREW_TAP_TOKEN }}" \
            https://api.github.com/repos/kelsi-andrewss/homebrew-claude-code-tracker/dispatches \
            -d '{"event_type":"formula-update","client_payload":{"tag":"${{ github.ref_name }}"}}'
